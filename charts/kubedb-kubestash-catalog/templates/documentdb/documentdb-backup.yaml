{{ $featureGates := .Values.featureGates }}
{{ $ubi := .Values.distro.ubi }}
{{- if .Values.global }}
  {{ $featureGates = mergeOverwrite dict .Values.featureGates .Values.global.featureGates }}
  {{ $ubi = default .Values.distro.ubi .Values.global.distro.ubi }}
{{- end }}

{{ if and $featureGates.DocumentDB (not (eq $ubi "operator")) }}
# Logical (pg_dump) backup of the DocumentDB Postgres backend.
#
# Identical in shape to postgres-backup - same plugin binary, same arguments. Everything
# DocumentDB-specific happens inside the plugin, selected from the AppBinding's appRef Kind:
# catalog registration, the pg_dump override, --dbname/--format/--exclude-schema. Nothing is
# passed from here, so this Function stays a drop-in peer of the Postgres one.
apiVersion: addons.kubestash.com/v1alpha1
kind: Function
metadata:
  name: 'documentdb-backup'
  labels:
    {{- include "kubedb-kubestash-catalog.labels" . | nindent 4 }}
spec:
  args:
  - backup
  - --namespace=${namespace:=default}
  - --backupsession=${backupSession:=}
  - --enable-cache=${enableCache:=}
  - --scratch-dir=${scratchDir:=}
  - --wait-timeout=${waitTimeout:={{ .Values.waitTimeout}}}
  - --pg-args=${args:={{ .Values.documentdb.backup.args }}}
  - --backup-cmd=${backupCmd:=}
  - --user=${user:=}
  availableVersions:
  - "17.2"
  image: '{{ include "image.ghcr" (merge (dict "_repo" "kubedb/postgres-restic-plugin") $) }}:v0.30.0-rc.2_${DB_VERSION}{{ include "catalog.ubi" $ }}'
{{ end }}
