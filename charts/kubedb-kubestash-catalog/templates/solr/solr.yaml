{{ $featureGates := .Values.featureGates }}
{{ $ubi := .Values.distro.ubi }}
{{- if .Values.global }}
  {{ $featureGates = mergeOverwrite dict .Values.featureGates .Values.global.featureGates }}
  {{ $ubi = default .Values.distro.ubi .Values.global.distro.ubi }}
{{- end }}

{{ if and $featureGates.Solr (not (eq $ubi "operator")) }}
apiVersion: addons.kubestash.com/v1alpha1
kind: Addon
metadata:
  name: 'solr'
  labels:
    {{- include "kubedb-kubestash-catalog.labels" . | nindent 4 }}
spec:
  backupTasks:
  - driver: Solr
    executor: Job
    function: solr-backup
    name: logical-backup
    parameters:
    - default: --match=^(?![.])(?!apm-agent-configuration)(?!kubedb-system).+
      name: args
      required: false
      usage: Specifies the database arguments which implies the indices which must be avoided while backup
    singleton: true
  restoreTasks:
  - driver: Solr
    executor: Job
    function: solr-restore
    name: logical-backup-restore
    parameters:
    - default: --match=^(?![.])(?!apm-agent-configuration)(?!kubedb-system).+
      name: args
      required: false
      usage: Specifies the database arguments which implies the indices which must be avoided while restore
    singleton: true
{{ end }}
