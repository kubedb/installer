{{ $featureGates := .Values.featureGates }}
{{ $ubi := .Values.distro.ubi }}
{{- if .Values.global }}
  {{ $featureGates = mergeOverwrite dict .Values.featureGates .Values.global.featureGates }}
  {{ $ubi = default .Values.distro.ubi .Values.global.distro.ubi }}
{{- end }}

{{ if and $featureGates.Milvus (not (eq $ubi "operator")) }}
apiVersion: addons.kubestash.com/v1alpha1
kind: Function
metadata:
  name: 'milvus-restore'
  labels:
    {{- include "kubedb-kubestash-catalog.labels" . | nindent 4 }}
spec:
  args:
  - restore
  - --namespace=${namespace:=default}
  - --restoresession=${restoreSession:=}
  - --snapshot=${snapshot:=}
  - --wait-timeout=${waitTimeout:={{ .Values.waitTimeout}}}
  - --restore-suffix=${restoreSuffix:=_restored}
  - --collections=${collections:=}
  - --in-place=${inPlaceRestore:=false}
  - --drop-exist-collection=${dropExistCollection:=false}
  - --restore-timeout=${restoreTimeout:=0s}
  image: '{{ include "image.ghcr" (merge (dict "_repo" "kubedb/milvus-backup-plugin") $) }}:v0.1.0{{ include "catalog.ubi" $ }}'
{{ end }}
