{{ $featureGates := .Values.featureGates }}
{{ $ubi := .Values.distro.ubi }}
{{- if .Values.global }}
  {{ $featureGates = mergeOverwrite dict .Values.featureGates .Values.global.featureGates }}
  {{ $ubi = default .Values.distro.ubi .Values.global.distro.ubi }}
{{- end }}

{{ if and $featureGates.Oracle (not (eq $ubi "operator")) }}
apiVersion: addons.kubestash.com/v1alpha1
kind: Addon
metadata:
  name: 'oracle-addon'
  labels:
    {{- include "kubedb-kubestash-catalog.labels" . | nindent 4 }}
spec:
  backupTasks:
  - driver: OracleBackup
    executor: Job
    function: oracle-backup
    name: physical-backup
    parameters:
    - default: "true"
      name: enableCache
      required: false
      usage: Enable or disable caching. Disabling caching may impact backup performance.
    - default: /kubestash-tmp
      name: scratchDir
      required: false
      usage: Directory for holding temporary files and oracle-backup cache.
    - name: walletSecret
      required: false
      usage: Wallet secret for OSBWS config.
    - name: targetPod
      required: false
      usage: Oracle pod to run RMAN on.
    - default: full
      name: backupStrategy
      required: false
      usage: 'full: a plain RMAN full backup. incremental: an RMAN INCREMENTAL LEVEL 0, identical in content but the only kind of backup the incremental-backup loop can chain LEVEL 1 and archived log backups to, which point-in-time recovery needs.'
    singleton: true
    volumeMounts:
    - mountPath: /kubestash-tmp
      name: kubestash-tmp-volume
    volumeTemplate:
    - name: kubestash-tmp-volume
      source:
        emptyDir: {}
      usage: Holds temporary files and oracle-backup cache.
  restoreTasks:
  - driver: OracleBackup
    executor: Job
    function: oracle-restore
    name: physical-backup-restore
    parameters:
    - default: "true"
      name: enableCache
      required: false
      usage: Enable or disable caching. Disabling caching may impact backup performance.
    - default: /kubestash-tmp
      name: scratchDir
      required: false
      usage: Directory for holding temporary files and oracle-backup cache.
    - name: untilTime
      required: false
      usage: Point-in-time recovery target in UTC (YYYY-MM-DD HH24:MI:SS). Overrides the snapshot's own recovery boundary and rolls forward to this instant instead. RMAN stops *before* it, so leave a few seconds of margin. Mutually exclusive with untilSCN.
    - name: untilSCN
      required: false
      usage: Recovery target as an SCN. Defaults to the boundary recorded on the snapshot, which stops recovery exactly at the backup so no redo written after it is applied. Only set this to override that.
    - name: recoveryTimestamp
      required: false
      usage: Point-in-time recovery target as an RFC 3339 instant, e.g. 2026-11-11T14:32:10Z. Picks the LEVEL 0 full backup whose recovery window covers it from the snapshot's repository and restores every change committed before it. Mutually exclusive with untilTime and untilSCN.
    - default: "false"
      name: restoreSPFile
      required: false
      usage: When restoring into a different database, also restore the source SPFILE instead of keeping the target's operator managed one.
    singleton: true
    volumeMounts:
    - mountPath: /kubestash-tmp
      name: kubestash-tmp-volume
    volumeTemplate:
    - name: kubestash-tmp-volume
      source:
        emptyDir: {}
      usage: Holds temporary files and oracle-backup cache.
{{ end }}
