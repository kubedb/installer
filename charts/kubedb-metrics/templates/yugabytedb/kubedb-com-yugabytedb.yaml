{{ $featureGates := .Values.featureGates }}
{{- if .Values.global }}
  {{ $featureGates = mergeOverwrite dict .Values.featureGates .Values.global.featureGates }}
{{- end }}

{{ if $featureGates.YugabyteDB }}

apiVersion: metrics.appscode.com/v1alpha1
kind: MetricsConfiguration
metadata:
  name: kubedb-com-yugabytedb
spec:
  targetRef:
    apiVersion: kubedb.com/v1alpha2
    kind: YugabyteDB
  commonLabels:
    - key: app
      valuePath: .metadata.name
    - key: app_namespace
      valuePath: .metadata.namespace
  metrics:
    - name: created
      help: "Unix creation time stamp"
      type: gauge
      field:
        path: .metadata.creationTimestamp
        type: DateTime
      metricValue:
        valueFromPath: .metadata.creationTimestamp

    - name: info
      help: "Kubedb YugabyteDB information"
      type: gauge
      labels:
        - key: version
          valuePath: .spec.version
        - key: storageType
          valuePath: .spec.storageType
        - key: deletionPolicy
          valuePath: .spec.deletionPolicy
        - key: storageClassName
          valuePath: .spec.storage.storageClassName
      metricValue:
        value: 1

    - name: replicas
      help: "Total number of YugabyteDB pods (masters and tservers)"
      type: gauge
      params:
        - key: obj
          valuePath: .
      metricValue:
        valueFromExpression: resource_replicas(obj)

    - name: status_conditions
      help: "YugabyteDB instance status condition"
      type: gauge
      field:
        path: .status.conditions
        type: Array
      labels:
        - key: type
          valuePath: .status.conditions[*].type
        - key: status
          valuePath: .status.conditions[*].status
      metricValue:
        value: 1

    - name: status_phase
      help: "YugabyteDB instance current phase"
      type: gauge
      field:
        path: .status.phase
        type: String
      params:
        - key: phase
          valuePath: .status.phase
      states:
        labelKey: phase
        values:
          - labelValue: Ready
            metricValue:
              valueFromExpression: "int(phase == 'Ready')"
          - labelValue: Halted
            metricValue:
              valueFromExpression: "int(phase == 'Halted')"
          - labelValue: Provisioning
            metricValue:
              valueFromExpression: "int(phase == 'Provisioning')"
          - labelValue: Critical
            metricValue:
              valueFromExpression: "int(phase == 'Critical')"
          - labelValue: NotReady
            metricValue:
              valueFromExpression: "int(phase == 'NotReady')"
          - labelValue: DataRestoring
            metricValue:
              valueFromExpression: "int(phase == 'DataRestoring')"

    - name: tls_enabled
      help: "YugabyteDB TLS enabled (1 when an issuerRef is configured, else 0)"
      type: gauge
      labels:
        - key: issuers_name
          valuePath: .spec.tls.issuerRef.name
      params:
        - key: issuer
          valuePath: .spec.tls.issuerRef.name
      metricValue:
        valueFromExpression: "int(issuer != '')"

    - name: tls_node_to_node
      help: "YugabyteDB node to node TLS (1 when an issuerRef is configured and spec.tls.nodeToNode is not false, else 0)"
      type: gauge
      params:
        - key: issuer
          valuePath: .spec.tls.issuerRef.name
        - key: nodeToNode
          valuePath: .spec.tls.nodeToNode
      metricValue:
        valueFromExpression: "int(issuer != '' && nodeToNode != false)"

    - name: tls_client_to_node
      help: "YugabyteDB client to node TLS (1 when an issuerRef is configured and spec.tls.clientToNode is not false, else 0)"
      type: gauge
      params:
        - key: issuer
          valuePath: .spec.tls.issuerRef.name
        - key: clientToNode
          valuePath: .spec.tls.clientToNode
      metricValue:
        valueFromExpression: "int(issuer != '' && clientToNode != false)"

    - name: auth_disabled
      help: "YugabyteDB authentication disabled (1 when spec.disableSecurity is true, else 0)"
      type: gauge
      params:
        - key: disableSecurity
          valuePath: .spec.disableSecurity
      metricValue:
        valueFromExpression: "int(disableSecurity == true)"

    - name: ycql_enabled
      help: "YugabyteDB YCQL API enabled (1 when spec.ycql.enabled is true, else 0)"
      type: gauge
      params:
        - key: enabled
          valuePath: .spec.ycql.enabled
      metricValue:
        valueFromExpression: "int(enabled == true)"

    - name: replication_factor
      help: "YugabyteDB replication factor (number of masters)"
      type: gauge
      metricValue:
        valueFromPath: .spec.replicationFactor

    - name: tserver_replicas
      help: "Number of YugabyteDB tserver replicas"
      type: gauge
      metricValue:
        valueFromPath: .spec.topology.tserver.replicas

    - name: resource_request_cpu
      help: "Requested CPU by YugabyteDB in core"
      type: gauge
      labels:
        - key: unit
          value: core
      params:
        - key: obj
          valuePath: .
        - key: resourceType
          value: cpu
      metricValue:
        valueFromExpression: total_resource_requests(obj, resourceType)

    - name: resource_request_memory
      help: "Requested memory by YugabyteDB in byte"
      type: gauge
      labels:
        - key: unit
          value: byte
      params:
        - key: obj
          valuePath: .
        - key: resourceType
          value: memory
      metricValue:
        valueFromExpression: total_resource_requests(obj, resourceType)

    - name: resource_request_storage
      help: "Requested storage by YugabyteDB in byte"
      type: gauge
      labels:
        - key: unit
          value: byte
      params:
        - key: obj
          valuePath: .
        - key: resourceType
          value: storage
      metricValue:
        valueFromExpression: total_resource_requests(obj, resourceType)

    - name: resource_limit_cpu
      help: "CPU limit for YugabyteDB in core"
      type: gauge
      labels:
        - key: unit
          value: core
      params:
        - key: obj
          valuePath: .
        - key: resourceType
          value: cpu
      metricValue:
        valueFromExpression: total_resource_limits(obj, resourceType)

    - name: resource_limit_memory
      help: "Memory limit for YugabyteDB in byte"
      type: gauge
      labels:
        - key: unit
          value: byte
      params:
        - key: obj
          valuePath: .
        - key: resourceType
          value: memory
      metricValue:
        valueFromExpression: total_resource_limits(obj, resourceType)

    - name: resource_limit_storage
      help: "Storage limit for YugabyteDB in byte"
      type: gauge
      labels:
        - key: unit
          value: byte
      params:
        - key: obj
          valuePath: .
        - key: resourceType
          value: storage
      metricValue:
        valueFromExpression: total_resource_limits(obj, resourceType)

{{ end }}
