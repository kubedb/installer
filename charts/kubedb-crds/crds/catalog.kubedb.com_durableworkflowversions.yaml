apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    app.kubernetes.io/name: kubedb
  name: durableworkflowversions.catalog.kubedb.com
spec:
  group: catalog.kubedb.com
  names:
    categories:
    - catalog
    - kubedb
    - appscode
    kind: DurableWorkflowVersion
    listKind: DurableWorkflowVersionList
    plural: durableworkflowversions
    shortNames:
    - dwversion
    singular: durableworkflowversion
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.distribution
      name: Distribution
      type: string
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .spec.server.image
      name: SERVER_IMAGE
      type: string
    - jsonPath: .spec.deprecated
      name: Deprecated
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              adminTools:
                properties:
                  image:
                    type: string
                required:
                - image
                type: object
              defaultHistoryShards:
                default: 16
                format: int32
                type: integer
              deprecated:
                type: boolean
              distribution:
                enum:
                - Temporal
                - Cadence
                type: string
              endOfLife:
                type: boolean
              ports:
                properties:
                  frontend:
                    properties:
                      grpc:
                        format: int32
                        type: integer
                      http:
                        format: int32
                        type: integer
                      membership:
                        format: int32
                        type: integer
                      tchannel:
                        format: int32
                        type: integer
                    type: object
                  history:
                    properties:
                      grpc:
                        format: int32
                        type: integer
                      http:
                        format: int32
                        type: integer
                      membership:
                        format: int32
                        type: integer
                      tchannel:
                        format: int32
                        type: integer
                    type: object
                  internalFrontend:
                    properties:
                      grpc:
                        format: int32
                        type: integer
                      http:
                        format: int32
                        type: integer
                      membership:
                        format: int32
                        type: integer
                      tchannel:
                        format: int32
                        type: integer
                    type: object
                  matching:
                    properties:
                      grpc:
                        format: int32
                        type: integer
                      http:
                        format: int32
                        type: integer
                      membership:
                        format: int32
                        type: integer
                      tchannel:
                        format: int32
                        type: integer
                    type: object
                  metrics:
                    format: int32
                    type: integer
                  ui:
                    format: int32
                    type: integer
                  worker:
                    properties:
                      grpc:
                        format: int32
                        type: integer
                      http:
                        format: int32
                        type: integer
                      membership:
                        format: int32
                        type: integer
                      tchannel:
                        format: int32
                        type: integer
                    type: object
                required:
                - frontend
                - history
                - matching
                - metrics
                - worker
                type: object
              publicClientTLS:
                type: boolean
              rollout:
                properties:
                  frontendShutdownDrainDuration:
                    type: string
                  frontendShutdownFailHealthCheckDuration:
                    type: string
                  historyMinInterval:
                    type: string
                  historyShutdownDrainDuration:
                    type: string
                  matchingShutdownDrainDuration:
                    type: string
                  onlineSchemaUpdate:
                    default: true
                    type: boolean
                  postHopSettle:
                    type: string
                  preStopSleep:
                    type: string
                  roleOrder:
                    items:
                      type: string
                    type: array
                type: object
              schema:
                properties:
                  dir:
                    type: string
                  stores:
                    items:
                      properties:
                        default:
                          type: boolean
                        type:
                          type: string
                        visibility:
                          type: boolean
                      required:
                      - type
                      type: object
                    type: array
                  tool:
                    enum:
                    - temporal-tools
                    - cadence-server
                    type: string
                required:
                - tool
                type: object
              securityContext:
                properties:
                  runAsUser:
                    format: int64
                    type: integer
                type: object
              server:
                properties:
                  image:
                    type: string
                required:
                - image
                type: object
              ui:
                properties:
                  image:
                    type: string
                required:
                - image
                type: object
              updateConstraints:
                properties:
                  allowlist:
                    items:
                      type: string
                    type: array
                  denylist:
                    items:
                      type: string
                    type: array
                type: object
              version:
                type: string
            required:
            - adminTools
            - distribution
            - ports
            - schema
            - server
            - version
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
