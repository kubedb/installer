{{- template "kubedb-catalog.refresh-versions" . }}

{{ $featureGates := .Values.featureGates }}
{{ $ubi := .Values.distro.ubi }}
{{- if .Values.global }}
  {{ $featureGates = mergeOverwrite dict .Values.featureGates .Values.global.featureGates }}
  {{ $ubi = default .Values.distro.ubi .Values.global.distro.ubi }}
{{- end }}

{{ if and $featureGates.DocumentDB (not (eq $ubi "operator")) }}
{{ if not (has "pg17-0.109.0" .Values.disableVersions.DocumentDB) }}


apiVersion: catalog.kubedb.com/v1alpha1
kind: DocumentDBVersion
metadata:
  name: 'pg17-0.109.0'
  labels:
    {{- include "kubedb-catalog.labels" . | nindent 4 }}
spec:
  archiver:
    addon:
      name: documentdb-addon
      tasks:
        fullBackup:
          name: physical-backup
        fullBackupRestore:
          name: physical-backup-restore
        manifestBackup:
          name: manifest-backup
        manifestRestore:
          name: manifest-restore
        volumeSnapshot:
          name: volume-snapshot
    walg:
      image: '{{ include "image.ghcr" (merge (dict "_repo" "kubedb/postgres-archiver") $) }}:v0.28.0-rc.2_17.2-alpine'
  coordinator:
    image: '{{ include "image.ghcr" (merge (dict "_repo" "kubedb/documentdb-coordinator") $) }}:v0.3.0-rc.2{{ include "catalog.ubi" $ }}'
  db:
    image: '{{ include "image.ghcr" (merge (dict "_repo" "documentdb/documentdb/documentdb-local") $) }}:pg17-0.109.0'
  initContainer:
    image: '{{ include "image.ghcr" (merge (dict "_repo" "kubedb/documentdb-init") $) }}:0.1.0'
  postgresPluginVersion: "17.2"
  postgresVersion: "17"
  securityContext:
    runAsUser: 1000
  version: 0.109.0
{{ end }}
{{ end }}
