{{- template "kubedb-catalog.refresh-versions" . }}

{{ $featureGates := .Values.featureGates }}
{{ $ubi := .Values.distro.ubi }}
{{- if .Values.global }}
  {{ $featureGates = mergeOverwrite dict .Values.featureGates .Values.global.featureGates }}
  {{ $ubi = default .Values.distro.ubi .Values.global.distro.ubi }}
{{- end }}

{{ if and $featureGates.Postgres (not (eq $ubi "operator")) }}
{{ if not (has "19.0" .Values.disableVersions.Postgres) }}


apiVersion: catalog.kubedb.com/v1alpha1
kind: PostgresVersion
metadata:
  name: '19.0'
  labels:
    {{- include "kubedb-catalog.labels" . | nindent 4 }}
spec:
  archiver:
    addon:
      name: postgres-addon
      tasks:
        fullBackup:
          name: physical-backup
        fullBackupRestore:
          name: physical-backup-restore
        manifestBackup:
          name: manifest-backup
        manifestRestore:
          name: manifest-restore
        volumeSnapshot:
          name: volume-snapshot
    walg:
      image: '{{ include "image.ghcr" (merge (dict "_repo" "kubedb/postgres-archiver") $) }}:v0.31.0_19.0-alpine'
  coordinator:
    image: '{{ include "image.ghcr" (merge (dict "_repo" "kubedb/pg-coordinator") $) }}:v0.53.0{{ include "catalog.ubi" $ }}'
  courier:
    cli:
      image: '{{ include "image.ghcr" (merge (dict "_repo" "kubedb/kubedb-migrator-postgresql") $) }}:v0.9.0{{ include "catalog.ubi" $ }}'
    statusReporter:
      image: '{{ include "image.ghcr" (merge (dict "_repo" "kubedb/kubedb-courier") $) }}:v0.9.0{{ include "catalog.ubi" $ }}'
  db:
    baseOS: alpine
    image: '{{ include "image.ghcr" (merge (dict "_repo" "appscode-images/postgres") $) }}:19.0-alpine'
  distribution: Official
  exporter:
    image: '{{ include "image.dockerHub" (merge (dict "_repo" "prometheuscommunity/postgres-exporter") $) }}:v0.18.1'
  initContainer:
    image: '{{ include "image.ghcr" (merge (dict "_repo" "kubedb/postgres-init") $) }}:0.22.0'
  securityContext:
    runAsAnyNonRoot: false
    runAsUser: 70
  ui:
  - name: pgadmin
    version: v2026.3.30
  - name: dbgate
    version: v2026.3.30
  updateConstraints:
    allowlist:
    - '>= 19.0'
  version: "19.0"
  podSecurityPolicies:
    databasePolicyName: {{ ternary "postgres-db" `""` (and .Values.psp.enabled (.Capabilities.APIVersions.Has "policy/v1beta1/PodSecurityPolicy")) }}
{{ end }}

---
{{ if not (has "19.0-bookworm" .Values.disableVersions.Postgres) }}


apiVersion: catalog.kubedb.com/v1alpha1
kind: PostgresVersion
metadata:
  name: '19.0-bookworm'
  labels:
    {{- include "kubedb-catalog.labels" . | nindent 4 }}
spec:
  archiver:
    addon:
      name: postgres-addon
      tasks:
        fullBackup:
          name: physical-backup
        fullBackupRestore:
          name: physical-backup-restore
        manifestBackup:
          name: manifest-backup
        manifestRestore:
          name: manifest-restore
        volumeSnapshot:
          name: volume-snapshot
    walg:
      image: '{{ include "image.ghcr" (merge (dict "_repo" "kubedb/postgres-archiver") $) }}:v0.31.0_19.0-bookworm'
  coordinator:
    image: '{{ include "image.ghcr" (merge (dict "_repo" "kubedb/pg-coordinator") $) }}:v0.53.0{{ include "catalog.ubi" $ }}'
  courier:
    cli:
      image: '{{ include "image.ghcr" (merge (dict "_repo" "kubedb/kubedb-migrator-postgresql") $) }}:v0.9.0{{ include "catalog.ubi" $ }}'
    statusReporter:
      image: '{{ include "image.ghcr" (merge (dict "_repo" "kubedb/kubedb-courier") $) }}:v0.9.0{{ include "catalog.ubi" $ }}'
  db:
    baseOS: bookworm
    image: '{{ include "image.ghcr" (merge (dict "_repo" "appscode-images/postgres") $) }}:19.0-bookworm'
  distribution: Official
  exporter:
    image: '{{ include "image.dockerHub" (merge (dict "_repo" "prometheuscommunity/postgres-exporter") $) }}:v0.18.1'
  initContainer:
    image: '{{ include "image.ghcr" (merge (dict "_repo" "kubedb/postgres-init") $) }}:0.22.0'
  securityContext:
    runAsAnyNonRoot: true
    runAsUser: 999
  ui:
  - name: pgadmin
    version: v2026.3.30
  - name: dbgate
    version: v2026.3.30
  updateConstraints:
    allowlist:
    - '>= 19.0'
  version: "19.0"
  podSecurityPolicies:
    databasePolicyName: {{ ternary "postgres-db" `""` (and .Values.psp.enabled (.Capabilities.APIVersions.Has "policy/v1beta1/PodSecurityPolicy")) }}
{{ end }}
{{ end }}
