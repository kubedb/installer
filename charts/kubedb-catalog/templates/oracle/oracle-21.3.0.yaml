{{- template "kubedb-catalog.refresh-versions" . }}

{{ $featureGates := .Values.featureGates }}
{{ $ubi := .Values.distro.ubi }}
{{- if .Values.global }}
  {{ $featureGates = mergeOverwrite dict .Values.featureGates .Values.global.featureGates }}
  {{ $ubi = default .Values.distro.ubi .Values.global.distro.ubi }}
{{- end }}

{{ if and $featureGates.Oracle (not (eq $ubi "operator")) }}
{{ if not (has "21.3.0" .Values.disableVersions.Oracle) }}


apiVersion: catalog.kubedb.com/v1alpha1
kind: OracleVersion
metadata:
  name: '21.3.0'
  labels:
    {{- include "kubedb-catalog.labels" . | nindent 4 }}
spec:
  archiver:
    addon:
      name: oracle-addon
      tasks:
        fullBackup:
          name: physical-backup
        fullBackupRestore:
          name: physical-backup-restore
    walg:
      image: '{{ include "image.ghcr" (merge (dict "_repo" "kubedb/oracle-backup-plugin") $) }}:v0.2.0'
  coordinator:
    image: '{{ include "image.ghcr" (merge (dict "_repo" "kubedb/oracle-coordinator") $) }}:v0.14.0{{ include "catalog.ubi" $ }}'
  dataGuard:
    initContainer:
      image: '{{ include "image.dockerLibrary" (merge (dict "_repo" "busybox") $) }}:1.36'
    observer:
      image: '{{ include "image.oracle" (merge (dict "_repo" "database/enterprise") $) }}:21.3.0.0'
  db:
    baseOS: debian
    image: '{{ include "image.oracle" (merge (dict "_repo" "database/enterprise") $) }}:21.3.0.0'
  exporter:
    image: '{{ include "image.oracle" (merge (dict "_repo" "database/observability-exporter") $) }}:2.2.1'
  initContainer:
    image: '{{ include "image.ghcr" (merge (dict "_repo" "kubedb/oracle-init") $) }}:v0.2.0'
  securityContext:
    runAsUser: 54321
  updateConstraints:
    allowlist:
    - 21.3.1
  version: 21.3.0
{{ end }}
{{ end }}
