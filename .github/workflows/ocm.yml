name: OCM

on:
  pull_request:
    branches:
      - "*"
    paths:
      - charts/kubedb-courier-addon-manager/**
      - hack/scripts/ocm-courier-test.sh
      - .github/workflows/ocm.yml
  push:
    branches:
      - master
    paths:
      - charts/kubedb-courier-addon-manager/**
      - hack/scripts/ocm-courier-test.sh
      - .github/workflows/ocm.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  courier-addon-manager:
    name: Courier Addon Manager (1 hub + 2 spokes)
    runs-on: ubuntu-24.04
    env:
      K8S_VERSION: v1.35.0
      CLUSTERADM_VERSION: v1.3.1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.31.0
          install_only: true

      - name: Install helm and clusteradm
        run: |
          pushd /usr/local/bin && sudo curl -fsSLO https://github.com/x-helm/helm/releases/latest/download/helm && sudo chmod +x helm && popd
          curl -fsSL https://github.com/open-cluster-management-io/clusteradm/releases/download/${CLUSTERADM_VERSION}/clusteradm_linux_amd64.tar.gz | tar -xz clusteradm
          sudo mv clusteradm /usr/local/bin/clusteradm
          clusteradm version

      - name: Test kubedb-courier-addon-manager chart
        run: ./hack/scripts/ocm-courier-test.sh
