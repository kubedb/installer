apiVersion: addons.kubestash.com/v1alpha1
kind: Function
metadata:
  name: milvus-physical-backup
spec:
  args:
  - physical-backup
  - --namespace=${namespace:=default}
  - --backupsession=${backupSession:=}
  - --quiesce=${quiesce:=DenyWrites}
  - --fence-settle=${fenceSettle:=10s}
  - --fence-timeout=${fenceTimeout:=60s}
  - --flush-timeout=${flushTimeout:=10m}
  - --allow-quiesce-downgrade=${allowQuiesceDowngrade:=false}
  - --parallelism=${parallelism:=16}
  image: ghcr.io/kubedb/milvus-backup-plugin:v0.1.0-rc.0
