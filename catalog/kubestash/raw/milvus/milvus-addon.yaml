apiVersion: addons.kubestash.com/v1alpha1
kind: Addon
metadata:
  name: milvus-addon
spec:
  backupTasks:
    - driver: Milvus
      executor: Job
      function: milvus-backup
      name: logical-backup
      parameters:
        - default: ""
          name: collections
          required: false
          usage: Collections to backup (comma-separated, empty means all)
        - default: "0s"
          name: backupTimeout
          required: false
          usage: Hard limit on the backup, as a Go duration (e.g. 6h). 0s means no limit
      singleton: true
    - name: physical-backup
      function: milvus-physical-backup
      driver: Restic
      executor: Job
      singleton: true
      parameters:
        - name: quiesce
          usage: How writes are quiesced for the crash-consistent capture. DenyWrites, Flush or None
          required: false
          default: DenyWrites
        - name: fenceSettle
          usage: Time to let Milvus pick up the write fence (it polls etcd config every 5s)
          required: false
          default: 10s
        - name: fenceTimeout
          usage: Maximum time writes may stay denied
          required: false
          default: 60s
        - name: flushTimeout
          usage: FlushAll timeout
          required: false
          default: 10m
        - name: allowQuiesceDowngrade
          usage: Fall back to Flush when quotaAndLimits.enabled is false
          required: false
          default: "false"
        - name: parallelism
          usage: Parallel object copies
          required: false
          default: "16"
    - name: volume-snapshot
      function: milvus-csi-snapshotter
      driver: VolumeSnapshotter
      executor: Job
      singleton: true
      parameters:
        - name: volumeSnapshotClassName
          usage: VolumeSnapshotClass for the CSI snapshot of the Standalone data PVC (warm cache)
          required: false
        - name: quiesce
          usage: How writes are quiesced for the crash-consistent capture. DenyWrites, Flush or None
          required: false
          default: DenyWrites
        - name: fenceSettle
          usage: Time to let Milvus pick up the write fence
          required: false
          default: 10s
        - name: fenceTimeout
          usage: Maximum time writes may stay denied
          required: false
          default: 60s
        - name: allowQuiesceDowngrade
          usage: Fall back to Flush when quotaAndLimits.enabled is false
          required: false
          default: "false"
    - name: manifest-backup
      function: kubedbmanifest-backup
      driver: Restic
      executor: Job
      singleton: true
      parameters:
        - name: enableCache
          usage: Enable or disable caching. Disabling caching may impact backup performance.
          required: false
          default: "true"
        - name: scratchDir
          usage: Directory for holding temporary files and restic cache.
          required: false
          default: /kubestash-tmp
      volumeTemplate:
        - name: kubestash-tmp-volume
          usage: Holds temporary files and restic cache.
          source:
            emptyDir: {}
      volumeMounts:
        - name: kubestash-tmp-volume
          mountPath: /kubestash-tmp
  restoreTasks:
    - driver: Milvus
      executor: Job
      function: milvus-restore
      name: logical-backup-restore
      parameters:
        - default: "_restored"
          name: restoreSuffix
          required: false
          usage: Suffix appended to restored collection names
        - default: ""
          name: collections
          required: false
          usage: Collections to restore, comma-separated <db>.<collection>. Empty restores every collection in the snapshot
        - default: "false"
          name: inPlaceRestore
          required: false
          usage: Restore over the source database, replacing the collections already there. Takes precedence over restoreSuffix. Destructive
        - default: "false"
          name: dropExistCollection
          required: false
          usage: Drop a collection in the target that collides with one being restored, instead of failing. Destructive
        - default: "0s"
          name: restoreTimeout
          required: false
          usage: Hard limit on the restore, as a Go duration (e.g. 6h). 0s means no limit
      singleton: true
    - name: physical-backup-restore
      function: milvus-physical-backup-restore
      driver: Restic
      executor: Job
      singleton: true
      parameters:
        - name: verify
          usage: Verification after the restore. sample, full or none
          required: false
          default: sample
        - name: parallelism
          usage: Parallel object copies
          required: false
          default: "16"
    - name: manifest-restore
      function: kubedbmanifest-restore
      driver: Restic
      executor: Job
      singleton: true
      parameters:
        - name: enableCache
          usage: Enable or disable caching. Disabling caching may impact backup performance.
          required: false
          default: "true"
        - name: scratchDir
          usage: Directory for holding temporary files and restic cache.
          required: false
          default: /kubestash-tmp
      volumeTemplate:
        - name: kubestash-tmp-volume
          usage: Holds temporary files and restic cache.
          source:
            emptyDir: {}
      volumeMounts:
        - name: kubestash-tmp-volume
          mountPath: /kubestash-tmp
