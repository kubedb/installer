apiVersion: addons.kubestash.com/v1alpha1
kind: Function
metadata:
  name: documentdb-physical-backup
spec:
  args:
  - physical-backup
  - --namespace=${namespace:=default}
  - --backupsession=${backupSession:=}
  - --enable-cache=${enableCache:=}
  - --scratch-dir=${scratchDir:=}
  - --wait-timeout=${waitTimeout:=300}
  - --pg-args=${args:=}
  - --backup-cmd=${backupCmd:=}
  - --user=${user:=}
  # The version of the AppBinding this Function is dispatched on, not the DocumentDB version.
  # A physical backup targets the <db>-admin AppBinding, whose spec.version is
  # DocumentDBVersion.spec.postgresPluginVersion - the Postgres major the backend actually runs.
  availableVersions:
  - "17.2"
  image: ghcr.io/kubedb/postgres-restic-plugin:v0.30.0-rc.2_${DB_VERSION}
