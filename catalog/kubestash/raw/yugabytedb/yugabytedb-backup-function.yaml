apiVersion: addons.kubestash.com/v1alpha1
kind: Function
metadata:
  name: yugabytedb-backup
spec:
  args:
  - backup
  - --namespace=${namespace:=default}
  - --backupsession=${backupSession:=}
  - --enable-cache=${enableCache:=}
  - --scratch-dir=${scratchDir:=}
  - --wait-timeout=${waitTimeout:=300}
  - --ysql-args=${args:=}
  - --databases=${databases:=}
  - --exclude-databases=${excludeDatabases:=}
  - --include-roles=${includeRoles:=}
  - --jobs=${jobs:=}
  availableVersions:
  - 2025.1.4
  - 2025.2.8
  image: ghcr.io/kubedb/yugabytedb-restic-plugin:v0.1.0_${DB_VERSION}
