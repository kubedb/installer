apiVersion: catalog.kubedb.com/v1alpha1
kind: Neo4jVersion
metadata:
  name: 2025.11.2
spec:
  archiver:
    addon:
      name: neo4j-addon
      tasks:
        fullBackup:
          name: logical-backup
        fullBackupRestore:
          name: logical-backup-restore
        manifestBackup:
          name: manifest-backup
    walg:
      image: ghcr.io/kubedb/neo4j-backup-plugin:v0.3.0-rc.2
  db:
    image: docker.io/library/neo4j:2025.11.2-enterprise
  gitSyncer:
    image: registry.k8s.io/git-sync/git-sync:v4.4.2
  securityContext:
    runAsUser: 7474
  updateConstraints:
    allowlist:
    - '>= 2025.11.2-enterprise'
    denylist:
    - '>= 5.26.28-enterprise, <= 5.26.28-enterprise'
  version: 2025.11.2-enterprise
