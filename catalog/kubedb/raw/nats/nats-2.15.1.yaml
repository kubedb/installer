apiVersion: catalog.kubedb.com/v1alpha1
kind: NATSVersion
metadata:
  name: 2.15.1
spec:
  db:
    image: ghcr.io/appscode-images/nats:2.15.1-alpine
  exporter:
    image: ghcr.io/appscode-images/prometheus-nats-exporter:0.20.2
  lameDuck:
    duration: 30s
    gracePeriod: 10s
  reloader:
    image: ghcr.io/appscode-images/nats-server-config-reloader:0.24.0
  securityContext:
    runAsUser: 1000
  updateConstraints:
    allowlist:
    - '>= 2.14.0, < 2.16.0'
    denylist: []
  version: 2.15.1
