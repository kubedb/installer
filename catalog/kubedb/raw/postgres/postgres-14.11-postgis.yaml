apiVersion: catalog.kubedb.com/v1alpha1
kind: PostgresVersion
metadata:
  name: 14-bullseye-postgis
spec:
  archiver:
    addon:
      name: postgres-addon
      tasks:
        fullBackup:
          name: physical-backup
        fullBackupRestore:
          name: physical-backup-restore
        manifestBackup:
          name: manifest-backup
        manifestRestore:
          name: manifest-restore
        volumeSnapshot:
          name: volume-snapshot
    walg:
      image: ghcr.io/kubedb/postgres-archiver:(v0.28.0-rc.0)_14.10-bookworm
  coordinator:
    image: ghcr.io/kubedb/pg-coordinator:v0.51.0-rc.0
  courier:
    cli:
      image: ghcr.io/kubedb/kubedb-migrator-postgresql:v0.7.0-rc.0
    statusReporter:
      image: ghcr.io/kubedb/kubedb-courier:v0.7.0-rc.0
  db:
    image: docker.io/postgis/postgis:14-3.4
  distribution: PostGIS
  exporter:
    image: docker.io/prometheuscommunity/postgres-exporter:v0.18.1
  initContainer:
    image: ghcr.io/kubedb/postgres-init:0.21.0
  podSecurityPolicies:
    databasePolicyName: postgres-db
  securityContext:
    runAsAnyNonRoot: true
    runAsUser: 999
  stash:
    addon:
      backupTask:
        name: postgres-backup-14.0
      restoreTask:
        name: postgres-restore-14.0
  ui:
  - name: pgadmin
    version: v2026.3.30
  - name: dbgate
    version: v2026.3.30
  updateConstraints:
    allowlist:
    - '>= 14.11'
  version: "14.11"
