apiVersion: catalog.kubedb.com/v1alpha1
kind: PostgresVersion
metadata:
  name: "19.0"
spec:
  archiver:
    addon:
      name: postgres-addon
      tasks:
        fullBackup:
          name: physical-backup
        fullBackupRestore:
          name: physical-backup-restore
        manifestBackup:
          name: manifest-backup
        manifestRestore:
          name: manifest-restore
        volumeSnapshot:
          name: volume-snapshot
    walg:
      image: ghcr.io/kubedb/postgres-archiver:(v0.31.0)_19.0-alpine
  coordinator:
    image: ghcr.io/kubedb/pg-coordinator:v0.53.0
  courier:
    cli:
      image: ghcr.io/kubedb/kubedb-migrator-postgresql:v0.9.0
    statusReporter:
      image: ghcr.io/kubedb/kubedb-courier:v0.9.0
  db:
    baseOS: alpine
    image: ghcr.io/appscode-images/postgres:19.0-alpine
  distribution: Official
  exporter:
    image: docker.io/prometheuscommunity/postgres-exporter:v0.18.1
  initContainer:
    image: ghcr.io/kubedb/postgres-init:0.22.0
  podSecurityPolicies:
    databasePolicyName: postgres-db
  securityContext:
    runAsAnyNonRoot: false
    runAsUser: 70
  ui:
  - name: pgadmin
    version: v2026.3.30
  - name: dbgate
    version: v2026.3.30
  updateConstraints:
    allowlist:
    - '>= 19.0'
  version: "19.0"

---
