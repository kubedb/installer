apiVersion: catalog.kubedb.com/v1alpha1
kind: PostgresVersion
metadata:
  name: 18.6-appscode
spec:
  archiver:
    addon:
      name: postgres-addon
      tasks:
        fullBackup:
          name: physical-backup
        fullBackupRestore:
          name: physical-backup-restore
        manifestBackup:
          name: manifest-backup
        manifestRestore:
          name: manifest-restore
        volumeSnapshot:
          name: volume-snapshot
    walg:
      image: ghcr.io/kubedb/postgres-archiver:(v0.28.0-rc.2)_18.2-alpine
  coordinator:
    image: ghcr.io/kubedb/pg-coordinator:v0.51.0-rc.2
  courier:
    cli:
      image: ghcr.io/kubedb/kubedb-migrator-postgresql:v0.7.0-rc.2
    statusReporter:
      image: ghcr.io/kubedb/kubedb-courier:v0.7.0-rc.2
  db:
    baseOS: alpine
    image: ghcr.io/appscode-images/postgres-enterprise:18.6-alpine
  distribution: AppsCode
  exporter:
    image: docker.io/prometheuscommunity/postgres-exporter:v0.18.1
  initContainer:
    image: ghcr.io/kubedb/postgres-init:0.21.0
  license:
    required: true
  podSecurityPolicies:
    databasePolicyName: postgres-db
  securityContext:
    runAsAnyNonRoot: false
    runAsUser: 70
  ui:
  - name: pgadmin
    version: v2026.3.30
  - name: dbgate
    version: v2026.3.30
  updateConstraints:
    allowlist:
    - '>= 18.6'
  version: "18.6"

