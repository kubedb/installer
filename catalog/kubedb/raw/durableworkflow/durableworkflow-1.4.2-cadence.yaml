apiVersion: catalog.kubedb.com/v1alpha1
kind: DurableWorkflowVersion
metadata:
  name: cadence-1.4.2
spec:
  adminTools:
    image: docker.io/ubercadence/server:v1.4.2
  defaultHistoryShards: 16
  distribution: Cadence
  ports:
    frontend:
      grpc: 7833
      tchannel: 7933
    history:
      grpc: 7834
      tchannel: 7934
    matching:
      grpc: 7835
      tchannel: 7935
    metrics: 9090
    ui: 8088
    worker:
      tchannel: 7939
  rollout:
    frontendShutdownDrainDuration: 10s
    historyMinInterval: 60s
    historyShutdownDrainDuration: 30s
    matchingShutdownDrainDuration: 10s
    onlineSchemaUpdate: true
    preStopSleep: 10s
    roleOrder:
    - history
    - matching
    - frontend
    - worker
  schema:
    dir: /etc/cadence/schema
    stores:
    - default: true
      type: Postgres
      visibility: true
    - default: true
      type: MySQL
      visibility: true
    - default: true
      type: Cassandra
      visibility: true
    - type: Elasticsearch
      visibility: true
    - type: OpenSearch
      visibility: true
    tool: cadence-server
  securityContext:
    runAsUser: 1000
  server:
    image: docker.io/ubercadence/server:v1.4.2
  ui:
    image: docker.io/ubercadence/web:v4.0.17
  updateConstraints:
    allowlist:
    - '> 1.4.2, < 1.5.0'
  version: 1.4.2
